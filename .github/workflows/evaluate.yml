name: Evaluate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python eval_runner.py --test-set test_cases/sample_eval_set.json --report reports/sample.json
      - run: python tune.py --experiments test_cases/tuning_example.json --report reports/tuning.json
      - run: python tune.py --grid configs/tuning_grid.json --report reports/plan.json
